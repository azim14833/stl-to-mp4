<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model → MP4 + Görünümler</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme=light]{--ink:#14202b;--mute:#5b6975;--bg:#e3e8ef;--panel:#f7f9fb;--card:#fff;--line:#e1e6ec;--field:#fff;--hover:#eef2f7;--accent:#3b5bfd;--accent-d:#2c46d4;--on-accent:#fff;--stage:#d5dce5;--dropbg:rgba(255,255,255,.55);--font:"Inter",system-ui,sans-serif;--fh:"Inter",system-ui,sans-serif;--r:14px;--sh:0 1px 2px rgba(18,32,46,.05),0 8px 24px rgba(18,32,46,.07);color-scheme:light}
[data-theme=dark]{--ink:#e8edf3;--mute:#93a1ae;--bg:#080a0d;--panel:#12161c;--card:#1a2029;--line:#2a3340;--field:#0f1318;--hover:#232c38;--accent:#6c8cff;--accent-d:#5373f0;--on-accent:#0a0f1f;--stage:#0e1217;--dropbg:rgba(26,32,41,.6);--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
[data-theme=ocean]{--ink:#e0f6ff;--mute:#8fb4c4;--bg:#04101a;--panel:#0a1c2a;--card:#0f2a3b;--line:#1c4157;--field:#08161f;--hover:#153a50;--accent:#22d3ee;--accent-d:#0fb5d1;--on-accent:#04222b;--stage:#071722;--dropbg:rgba(15,42,59,.6);--font:"Space Grotesk",system-ui,sans-serif;--fh:"Space Grotesk",system-ui,sans-serif;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,20,30,.45);color-scheme:dark}
[data-theme=sunset]{--ink:#3a2418;--mute:#86624f;--bg:#f0dcc9;--panel:#fbf3ea;--card:#fffaf4;--line:#efdccb;--field:#fff;--hover:#f7e8d8;--accent:#e8622c;--accent-d:#c94c1a;--on-accent:#fff;--stage:#e6cdb6;--dropbg:rgba(255,250,244,.6);--font:"Manrope",system-ui,sans-serif;--fh:"Manrope",system-ui,sans-serif;--sh:0 1px 2px rgba(90,40,10,.06),0 8px 24px rgba(90,40,10,.1);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 var(--font),"Noto Sans","Noto Sans Arabic",Arial,sans-serif;color:var(--ink);background:var(--bg);padding:12px;gap:12px;display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,29vw,420px);grid-template-rows:minmax(0,1fr);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
#stage{position:relative;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0;min-width:0;border-radius:22px;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--stage) 70%,#fff 30%),var(--stage));box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
#cv{width:100%;height:100%;object-fit:contain;display:block;touch-action:none;cursor:grab;border-radius:14px}
#cv:active{cursor:grabbing}
#cv.tr{background:repeating-conic-gradient(#c9ced2 0 25%,#e6e9ec 0 50%) 0 0/20px 20px}
#stage:not(.has){cursor:pointer}
#drop{position:absolute;inset:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;border:2px dashed var(--mute);border-radius:16px;color:var(--ink);text-align:center;pointer-events:none;background:var(--dropbg);backdrop-filter:blur(8px)}
#drop b{font:700 clamp(17px,2.4vw,22px) var(--fh)}
#drop span{max-width:46ch;color:var(--mute)}
#stage.over #drop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
#stage.has #drop{display:none}
#toast{position:absolute;left:24px;right:24px;top:24px;background:#b3261e;color:#fff;padding:10px 14px;border-radius:10px;display:none;font-weight:500;overflow-wrap:anywhere}
aside{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:16px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;min-width:0;transition:background .25s}
aside::-webkit-scrollbar{width:8px}aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
h1{font:700 19px/1.25 var(--fh);margin:0;letter-spacing:-.02em;overflow-wrap:anywhere}
.sub{color:var(--mute);margin:2px 0 0;font-size:13px;overflow-wrap:anywhere}
.hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.hd>div{min-width:0;flex:1}#lang{width:auto;min-width:96px;max-width:44%;flex:none}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.themes button{min-height:34px;padding:5px 6px;font-size:12px;gap:6px;border-radius:999px}
.themes button::before{content:"";width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--mute);background:var(--tc)}
.themes button.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
fieldset{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 14px;margin:0;display:grid;gap:10px;min-width:0;box-shadow:var(--sh)}
legend{font:700 11px var(--fh);letter-spacing:.08em;text-transform:uppercase;padding:0 6px;color:var(--accent)}
label{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 8px;align-items:center;min-width:0}
label.rng{grid-template-columns:minmax(0,1fr) auto}
aside>*{flex-shrink:0}
label>span{min-width:0;overflow-wrap:anywhere}
label>span:last-of-type:not(:first-child){color:var(--mute);font-variant-numeric:tabular-nums}
label input[type=range]{grid-column:1/-1;width:100%;margin:2px 0;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row label{grid-template-columns:minmax(0,1fr)}
.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.xyz label{grid-template-columns:minmax(0,1fr)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.qv button{min-height:32px;padding:5px 4px;font-size:12px}
.chk{grid-template-columns:auto minmax(0,1fr);justify-content:start;gap:8px}.chk input{width:16px;height:16px;accent-color:var(--accent)}
select,input[type=text],input[type=number]{width:100%;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;background-color:var(--field);color:var(--ink);font:inherit;padding:0 10px}
select{appearance:none;-webkit-appearance:none;padding-inline-end:30px;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
[dir=rtl] select{background-position:12px 50%,17px 50%}
select option,select optgroup{background:var(--card);color:var(--ink);font:inherit}
input[type=color]{width:100%;min-width:0;height:38px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer}
select:hover,input:hover{border-color:var(--mute)}
button,.btn{font:inherit;font-weight:600;min-height:38px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:normal;overflow-wrap:anywhere;line-height:1.25;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
button:hover:not(:disabled),.btn:hover{background:var(--hover);border-color:var(--mute)}
button:active:not(:disabled){transform:translateY(1px)}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent-d);color:var(--on-accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
button.primary:hover:not(:disabled),.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.small{min-height:34px;padding:6px 10px;font-size:13px}.big{min-height:50px;font-size:15px;width:100%;border-radius:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.swatches i{width:1px;height:20px;background:var(--line);margin:0 2px}
#bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#msg{color:var(--mute);min-height:20px;overflow-wrap:anywhere}#msg.err{color:#e5484d}
#res{display:none;gap:8px;flex-direction:column}#res video{width:100%;background:#000;border-radius:12px}
#gal{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#gal button{display:block;font-size:12px;font-weight:500;min-height:0;padding:0;border:0;background:none;box-shadow:none;overflow:hidden;color:var(--mute)}
#gal img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--hover);border:1px solid var(--line);border-radius:10px;display:block}
#photos{display:flex;flex-wrap:wrap;gap:6px}#photos img{width:56px;height:40px;object-fit:cover;border:2px solid var(--line);border-radius:8px;cursor:pointer}#photos img.sel{border-color:var(--accent)}
#lb{position:fixed;inset:0;background:rgba(10,16,20,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9;padding:20px}
#lb img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:10px;background:repeating-conic-gradient(#c9ced2 0 25%,#e6e9ec 0 50%) 0 0/20px 20px}
.lbb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
[data-th=light]{--tc:#fff}[data-th=dark]{--tc:#1a2029}[data-th=ocean]{--tc:#22d3ee}[data-th=sunset]{--tc:#e8622c}
@media(max-width:860px){
  html,body{height:auto}
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  #stage{height:56vh;min-height:300px}
  aside{overflow:visible}
  select,input[type=text],input[type=number]{font-size:16px}
}
@media(max-width:400px){.xyz{grid-template-columns:minmax(0,1fr)}.qv{grid-template-columns:repeat(3,minmax(0,1fr))}.row{grid-template-columns:minmax(0,1fr)}#gal{grid-template-columns:repeat(2,minmax(0,1fr))}.themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="drop" role="button" tabindex="0"><b>Modeli buraya bırak</b><span>STL, 3MF veya OBJ (birden fazla olabilir). Arka plan için bir resim de bırakabilirsin.</span></div>
  <div id="toast"></div>
</main>
<aside>
  <div class="hd">
    <div><h1 data-i="title"></h1><p class="sub" data-i="sub"></p></div>
    <select id="lang" aria-label="Language"><option value="tr">Türkçe</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="ru">Русский</option><option value="ar">العربية</option></select>
  </div>
  <div class="themes" id="themes"><button data-th="light" data-i="th_light"></button><button data-th="dark" data-i="th_dark"></button><button data-th="ocean" data-i="th_ocean"></button><button data-th="sunset" data-i="th_sunset"></button></div>
  <button id="open" class="primary" data-i="open"></button>
  <input id="file" type="file" accept=".stl,.3mf,.obj" multiple hidden>
  <select id="models" style="display:none"></select>
  <div id="info" class="sub"></div>
  <div id="stats" class="sub"></div>
  <div class="two"><button id="fsb" class="small" data-i="fs"></button><button id="pau" class="small" data-i="pause"></button></div>

  <fieldset>
    <legend data-i="g_bg"></legend>
    <label><span data-i="scene"></span><select id="bg">
      <optgroup data-g="grp_3d">
        <option value="ref" data-i="e_ref"></option><option value="refwin" data-i="e_refwin"></option><option value="refshelf" data-i="e_refshelf"></option><option value="refwarm" data-i="e_refwarm"></option><option value="refcool" data-i="e_refcool"></option><option value="refnight" data-i="e_refnight"></option><option value="checker" data-i="e_checker"></option><option value="marble" data-i="e_marble"></option><option value="loft" data-i="e_loft"></option><option value="garden" data-i="e_garden"></option><option value="cove" data-i="e_cove"></option><option value="dark" data-i="e_dark"></option>
      </optgroup>
      <optgroup data-g="grp_simple">
        <option value="studio" data-i="b_studio"></option><option value="grad" data-i="b_grad"></option><option value="solid" data-i="b_solid"></option><option value="concrete" data-i="b_conc"></option><option value="outdoor" data-i="b_out"></option><option value="transparent" data-i="b_trans"></option>
      </optgroup>
      <optgroup data-g="grp_photo">
        <option value="p1" data-i="s1"></option><option value="p2" data-i="s2"></option><option value="p3" data-i="s3"></option><option value="p4" data-i="s4"></option><option value="p5" data-i="s5"></option>
        <option value="p6" data-i="s6"></option><option value="p7" data-i="s7"></option><option value="p8" data-i="s8"></option><option value="p9" data-i="s9"></option><option value="p10" data-i="s10"></option>
        <option value="photo" data-i="b_photo"></option>
      </optgroup>
    </select></label>
    <div class="row" id="cols">
      <label><span data-i="c1"></span><input id="cb" type="color" value="#eef1f4"></label>
      <label><span data-i="c2"></span><input id="cb2" type="color" value="#aab6c0"></label>
    </div>
    <label><span data-i="blur"></span><span id="vBl">0</span><input id="blur" type="range" min="0" max="30" step="1" value="0"></label>
    <div id="photos"></div>
    <button id="pickPhoto" class="small" data-i="addphoto"></button>
    <input id="photo" type="file" accept="image/*" multiple hidden>
    <label class="chk"><input id="sh" type="checkbox" checked><span data-i="shadow"></span></label>
  </fieldset>

  <fieldset>
    <legend data-i="g_harm"></legend>
    <label><span data-i="h_az"></span><span id="vLa">0°</span><input id="la" type="range" min="-90" max="90" step="1" value="35"></label>
    <label><span data-i="h_warm"></span><span id="vLw">0</span><input id="lw" type="range" min="-100" max="100" step="1" value="0"></label>
    <label><span data-i="h_str"></span><span id="vLs">1.00</span><input id="ls" type="range" min="0.3" max="1.8" step="0.05" value="1"></label>
    <label><span data-i="h_sh"></span><span id="vSa">0.28</span><input id="sa" type="range" min="0" max="0.8" step="0.02" value="0.28"></label>
    <label><span data-i="h_vs"></span><span id="vVs">0%</span><input id="vs" type="range" min="-30" max="30" step="1" value="0"></label>
    <div class="row">
      <label><span data-i="h_tint"></span><input id="ct" type="color" value="#ff9a3c"></label>
      <label><span data-i="h_tints"></span><input id="ts" type="range" min="0" max="60" step="1" value="0"></label>
    </div>
    <button id="autoH" class="small" data-i="h_auto"></button>
  </fieldset>

  <fieldset>
    <legend data-i="g_model"></legend>
    <div class="row">
      <label><span data-i="mat"></span><select id="mat"><option value="plastik" data-i="m1"></option><option value="mat" data-i="m2"></option><option value="parlak" data-i="m3"></option><option value="kil" data-i="m4"></option><option value="metal" data-i="m5"></option><option value="firca" data-i="m6"></option></select></label>
      <label><span data-i="col"></span><input id="cm" type="color" value="#d8d3c9"></label>
    </div>
    <div id="sw" class="swatches"></div>
    <div class="row">
      <label><span data-i="upax"></span><select id="up"><option value="z">Z (STL, 3MF)</option><option value="y">Y (OBJ)</option></select></label>
      <label><span data-i="dir"></span><select id="dir"><option value="1" data-i="ccw"></option><option value="-1" data-i="cw"></option></select></label>
    </div>
    <label class="chk"><input id="wf" type="checkbox"><span data-i="wire"></span></label>
  </fieldset>

  <fieldset>
    <legend data-i="g_tr"></legend>
    <div class="xyz">
      <label><span data-i="rot" data-s=" X°"></span><input id="rx" type="number" step="15" value="0"></label>
      <label><span data-i="rot" data-s=" Y°"></span><input id="ry" type="number" step="15" value="0"></label>
      <label><span data-i="rot" data-s=" Z°"></span><input id="rz" type="number" step="15" value="0"></label>
    </div>
    <div class="three"><button id="bx">X +90°</button><button id="by">Y +90°</button><button id="bz">Z +90°</button></div>
    <div class="xyz">
      <label><span data-i="pos" data-s=" X (mm)"></span><input id="px" type="number" step="10" value="0"></label>
      <label><span data-i="pos" data-s=" Y (mm)"></span><input id="py" type="number" step="10" value="0"></label>
      <label><span data-i="pos" data-s=" Z (mm)"></span><input id="pz" type="number" step="10" value="0"></label>
    </div>
    <label><span data-i="scale"></span><span id="vSc">1.00</span><input id="sc" type="range" min="0.2" max="3" step="0.01" value="1"></label>
    <div class="two"><button id="trReset" class="small" data-i="reset"></button><button id="flat" class="small" data-i="flat"></button></div>
  </fieldset>

  <fieldset>
    <legend data-i="g_cam"></legend>
    <label><span data-i="el"></span><span id="vEl">22°</span><input id="el" type="range" min="-85" max="85" step="1" value="22"></label>
    <label><span data-i="zoom"></span><span id="vZm">1.00</span><input id="zm" type="range" min="0.3" max="4" step="0.01" value="1"></label>
    <div class="sub" data-i="qv"></div>
    <div class="qv"><button data-qv="0,0" data-i="v_front"></button><button data-qv="180,0" data-i="v_back"></button><button data-qv="-90,0" data-i="v_right"></button><button data-qv="90,0" data-i="v_left"></button><button data-qv="0,85" data-i="v_top"></button><button data-qv="0,-85" data-i="v_bot"></button><button data-qv="45,35" data-i="v_iso"></button></div>
    <div class="sub" data-i="keys"></div>
    <label class="chk"><input id="bob" type="checkbox"><span data-i="bob"></span></label>
    <label class="chk"><input id="ortho" type="checkbox" checked><span data-i="ortho"></span></label>
    <label class="chk"><input id="iso" type="checkbox"><span data-i="iso"></span></label>
  </fieldset>

  <fieldset>
    <legend data-i="g_tools"></legend>
    <label class="chk"><input id="edg" type="checkbox"><span data-i="edg"></span></label>
    <button id="snap" class="small" data-i="snap"></button>
    <div class="two"><button id="cfgx" class="small" data-i="cfgx"></button><button id="cfgi" class="small" data-i="cfgi"></button></div>
    <button id="cfgr" class="small" data-i="cfgr"></button>
    <input id="cfgf" type="file" accept=".json,application/json" hidden>
  </fieldset>

  <fieldset>
    <legend data-i="g_out"></legend>
    <div class="row">
      <label><span data-i="resol"></span><select id="res">
        <option value="1280x720">1280×720</option><option value="1920x1080" selected>1920×1080</option>
        <option value="1080x1080">1080×1080</option><option value="1080x1920">1080×1920</option><option value="3840x2160">3840×2160 (4K)</option>
      </select></label>
      <label><span data-i="fmt"></span><select id="fmt"><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option></select></label>
    </div>
    <div class="row">
      <label><span>FPS</span><select id="fps"><option>24</option><option selected>30</option><option>60</option></select></label>
      <label><span data-i="turns"></span><select id="turns"><option>1</option><option>2</option><option>3</option></select></label>
    </div>
    <label><span data-i="dur"></span><span id="vDur">6</span><input id="dur" type="range" min="2" max="30" step="1" value="6"></label>
    <label><span data-i="q"></span><span id="vBr">12 Mbps</span><input id="br" type="range" min="2" max="40" step="1" value="12"></label>
    <label class="chk"><input id="cap" type="checkbox"><span data-i="cap"></span></label>
    <label><span data-i="capt"></span><input id="capt" type="text" value=""></label>
    <label class="chk"><input id="gif" type="checkbox"><span data-i="gif"></span></label>
    <label class="chk"><input id="sheet" type="checkbox"><span data-i="sheet"></span></label>
    <label><span data-i="save"></span><select id="sv"><option value="dl" data-i="sv1"></option><option value="dir" data-i="sv2"></option></select></label>
    <button id="pickDir" class="small" style="display:none" data-i="pickdir"></button>
  </fieldset>

  <button id="all" class="primary big" disabled data-i="go"></button>
  <div class="two"><button id="onlyV" disabled data-i="onlyv"></button><button id="onlyI" disabled data-i="onlyi"></button></div>
  <button id="batch" style="display:none" disabled data-i="batch"></button>
  <div id="bar"><i></i></div>
  <div id="msg"></div>
  <div id="res"><video id="vid" controls loop></video><a id="dl" class="btn primary"></a></div>
  <div id="gal"></div>
